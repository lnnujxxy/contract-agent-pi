<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>合同审查 Agent</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #1f3b35 0, transparent 38%), #0d1117; }
      main { display: grid; grid-template-columns: minmax(360px, 0.9fr) minmax(420px, 1.1fr); gap: 18px; padding: 18px; height: calc(100vh - 36px); box-sizing: border-box; }
      artifact-sandbox { display: block; min-height: 0; border: 1px solid #30363d; border-radius: 14px; overflow: hidden; background: #fff; }
      artifact-sandbox iframe { width: 100%; height: 100%; border: 0; background: #fff; }
      @media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } artifact-sandbox { min-height: 65vh; } }
    </style>
  </head>
  <body>
    <main>
      <chat-panel></chat-panel>
      <artifact-sandbox></artifact-sandbox>
    </main>
    <script type="module" src="/chat-panel.js"></script>
  </body>
</html>
